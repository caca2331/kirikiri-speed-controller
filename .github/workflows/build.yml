name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_GUI=ON -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Check binaries (imports, manifest)
        shell: pwsh
        run: ./.github/scripts/check_binaries.ps1 -BinDir build/Release

  package:
    name: Package (dist)
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build both architectures and stage dist
        run: cmake -P cmake/dual_arch.cmake
      - name: Check staged layout
        shell: pwsh
        run: |
          $root = 'dist/KrkrSpeedController'
          if (Test-Path "$root/SoundTouch.dll") { throw 'SoundTouch.dll must not be staged beside the controller' }
          foreach ($f in 'KrkrSpeedController.exe', 'ui_texts.yaml', 'process_blacklist.txt') {
            if (-not (Test-Path "$root/$f")) { throw "missing $f" }
          }
          foreach ($arch in 'x86', 'x64') {
            foreach ($f in 'krkr_injector.exe', 'krkr_speed_hook.dll', 'SoundTouch.dll') {
              if (-not (Test-Path "$root/$arch/$f")) { throw "missing $arch/$f" }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: KrkrSpeedController
          path: dist/KrkrSpeedController
          if-no-files-found: error

  linux-tests:
    name: DSP tests (Linux, sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >
          cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -Wall -Wextra"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
